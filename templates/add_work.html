<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    {% include "components/head.html" %}
</head>

<body class="min-h-full bg-gray-50 dark:bg-gray-900">
    <div class="container mx-auto">
        {% include "header.html" %}

        <div class="max-w-4xl mx-auto mt-8 p-6 bg-white dark:bg-gray-800 rounded-lg shadow">
            <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">Add Work Records</h2>

            <form method="post" class="space-y-4" id="work-form" x-data="workForm">
                <div x-data="{ workDate: new Date().toISOString().split('T')[0] }" class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Work Date
                    </label>
                    <input type="date" name="work_date" x-model="workDate"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-4 py-2 border-2"
                        required>
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700 text-sm">
                        <thead class="bg-gray-50 dark:bg-gray-700">
                            <tr>
                                <th class="px-1 py-1 text-left font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">User</th>
                                <th class="px-1 py-1 text-left font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Tea</th>
                                <th class="px-1 py-1 text-left font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Adj</th>
                                <th class="px-1 py-1 text-left font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Tea Loc</th>
                                <th class="px-1 py-1 text-left font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Cost</th>
                                <th class="px-1 py-1 text-left font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Work Loc</th>
                                <th class="px-1 py-1 text-left font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Adv</th>
                                <th class="px-1 py-1 text-left font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Desc</th>
                                <th class="px-1 py-1 text-left font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider"></th>
                            </tr>
                        </thead>
                        <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                            <template x-for="(record, index) in records" :key="index">
                                <tr>
                                    <td class="px-1 py-1">
                                        <select :name="'user_id[]'"
                                            class="w-32 rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-1 py-1 border text-sm"
                                            required>
                                            <option value="" disabled selected>Select user</option>
                                            {% for user in users %}
                                            <option value="{{ user.id }}">{{ user.username }}</option>
                                            {% endfor %}
                                        </select>
                                    </td>
                                    <td class="px-1 py-1">
                                        <input type="number" step="0.01" :name="'tea_weight[]'"
                                            x-model="record.teaWeight"
                                            class="w-20 rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-1 py-1 border text-sm"
                                            placeholder="kg">
                                    </td>
                                    <td class="px-1 py-1">
                                        <input type="number" step="0.01" readonly
                                            class="w-20 rounded-md bg-gray-100 dark:bg-gray-700 border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:border-gray-600 dark:text-gray-200 px-1 py-1 border cursor-not-allowed text-sm"
                                            :value="adjustedTeaWeight(record.teaWeight)">
                                    </td>
                                    <td class="px-1 py-1">
                                        <input type="text" :name="'tea_location[]'"
                                            class="w-24 rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-1 py-1 border text-sm"
                                            placeholder="Location">
                                    </td>
                                    <td class="px-1 py-1">
                                        <input type="number" step="0.01" :name="'other_cost[]'"
                                            class="w-20 rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-1 py-1 border text-sm"
                                            placeholder="Rs">
                                    </td>
                                    <td class="px-1 py-1">
                                        <input type="text" :name="'other_location[]'"
                                            class="w-24 rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-1 py-1 border text-sm"
                                            placeholder="Location">
                                    </td>
                                    <td class="px-1 py-1">
                                        <input type="number" step="0.01" :name="'advance_amount[]'"
                                            class="w-20 rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-1 py-1 border text-sm"
                                            placeholder="Rs">
                                    </td>
                                    <td class="px-1 py-1">
                                        <input type="text" :name="'work_description[]'"
                                            class="w-32 rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-1 py-1 border text-sm"
                                            placeholder="Description">
                                    </td>
                                    <td class="px-1 py-1">
                                        <button type="button" @click="removeRecord(index)"
                                            class="text-red-600 hover:text-red-800 text-sm">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                                            </svg>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="flex justify-between">
                    <button type="button" @click="addRecord()"
                        class="bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
                        + Add Another Record
                    </button>
                    
                    <button type="submit"
                        class="bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition-colors">
                        Save All Records
                    </button>
                </div>
            </form>
        </div>
        <div class="max-w-2xl mx-auto mt-8 p-6 bg-white dark:bg-gray-800 rounded-lg shadow">
            <!-- Add after the existing form -->
            <form method="post" class="space-y-4 mt-8" action="/add-factory-tea"
                x-data="{ factoryDate: new Date().toISOString().split('T')[0] }">
                <h2 class="text-xl font-bold mb-4 text-gray-900 dark:text-white">Add Factory Tea Leaves</h2>

                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Factory
                        </label>
                        <select name="factory_id" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-4 py-2 border-2">
                            <option value="">Select Factory</option>
                            {% for factory in factories %}
                            <option value="{{ factory.id }}">{{ factory.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Date
                        </label>
                        <input type="date" name="factory_date" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-4 py-2 border-2"
                            x-model="factoryDate">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Weight Type
                        </label>
                        <select name="weight_type" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-4 py-2 border-2">
                            <option value="verified">Verified</option>
                            <option value="unverified">Unverified</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Leaves Weight (kg)
                        </label>
                        <input type="number" step="0.01" name="leaves_weight" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-4 py-2 border-2">
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
                    Save Factory Tea
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('workForm', () => ({
                records: [{}],
                workDate: new Date().toISOString().split('T')[0],
                factoryDate: new Date().toISOString().split('T')[0],
                addRecord() {
                    this.records.push({});
                },
                removeRecord(index) {
                    this.records.splice(index, 1);
                },
                adjustedTeaWeight(weight) {
                    if (!weight) return '';
                    const w = parseFloat(weight);
                    if (w > 60) return (w - 4).toFixed(2);
                    if (w > 25) return (w - 3).toFixed(2);
                    if (w > 18) return (w - 2).toFixed(2);
                    if (w > 10) return (w - 1).toFixed(2);
                    return w.toFixed(2);
                }
            }));
        });
    </script>
</body>

</html>
